name: download NEMWEB files and push to BigQuery
on: 
  schedule:
    - cron: '1 8 * * *'
      timezone: 'Australia/Brisbane' # Fixed UTC+10 year-round
  
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: pip install -r requirements.txt