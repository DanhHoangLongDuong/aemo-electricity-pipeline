name: download NEMWEB files and push to BigQuery
on: 
  schedule:
    - cron: '1 8 * * *'
      timezone: 'Australia/Brisbane' # Fixed UTC+10 year-round
  
  workflow_dispatch:
  push:
    branches:
      - automation

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GCP_project: ${{ vars.PROJECT_ID }}
    permissions:
      contents: read
      id-token: write
    steps:
    - name: checkout
      uses: actions/checkout@v7

    - name: install python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: install requirements
      run: pip install -r requirements.txt

    - name: google auth
      uses: 'google-github-actions/auth@v3'
      with:
        workload_identity_provider: ${{ vars.PROVIDER_RESOURCE_NAME }}
        service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

    - name: connection check
      run: python src/connection_check.py 