name: risk test by downloading 1 NEMWEB file

on:
  workflow_dispatch:

jobs:                            
  download-NEMWEB-file:                         
    runs-on: ubuntu-latest       
    steps:
      - name: download repo into runner
        uses: actions/checkout@v7    

      - name: setup Python
        uses: actions/setup-python@v7
        with: 
          python-version: '3.14'
          cache: 'pip'

      - name: install requirements.txt
        run: |
             python -m pip install --upgrade pip
             pip install -r requirements.txt

      - name: download a file in NEMWEB
        run: python src/download_file_test.py